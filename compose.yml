services:
  mysql:
    image: mysql:8.0
    container_name: campus-hub-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_pass123}
      MYSQL_DATABASE: ${DB_NAME:-campus_hub}
      MYSQL_USER: ${DB_USERNAME:-campus_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-campus_pass123}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD:-root_pass123} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: campus-hub-backend:latest
    container_name: campus-hub-backend
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${DB_NAME:-campus_hub}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: ${DB_USERNAME:-campus_user}
      DB_PASSWORD: ${DB_PASSWORD:-campus_pass123}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${DB_NAME:-campus_hub}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-campus_user}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-campus_pass123}
      SERVER_PORT: 8080
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

volumes:
  mysql_data:
